name: Build Android APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generar Keystore de depuración
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
        cp debug.keystore app/debug.keystore 2>/dev/null || true

    - name: Buscar y compilar APK
      run: |
        GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          echo "Gradlew encontrado en: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          ./gradlew assembleDebug
        else
          echo "No se encontró gradlew, compilando con Gradle del sistema..."
          gradle assembleDebug
        fi

    - name: Subir archivo APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-aplicacion-apk
        path: '**/build/outputs/apk/debug/*.apk'
